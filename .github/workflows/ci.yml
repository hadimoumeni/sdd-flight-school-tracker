name: CI

# Every push and every pull request: lint, test with coverage, and build both images.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [maintenance, scheduling]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # pyproject.toml adds --cov-fail-under=70, so this step fails below 70% coverage.
      - name: Unit tests with coverage
        run: pytest

  build:
    name: build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [maintenance, scheduling]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}

  # Cross-seam test against the real system: SQL Server and both services from
  # docker-compose.yml on the runner (never Azure SQL). It also stops maintenance to
  # check that scheduling fails fast with a clear 503.
  integration:
    name: cross-seam integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r tests/integration/requirements.txt

      - name: Start the whole system
        run: docker compose up -d --build

      - name: Integration tests
        run: pytest tests/integration -v

      - name: Service logs
        if: failure()
        run: docker compose logs

      - name: Stop the system
        if: always()
        run: docker compose down -v
